name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Dependency audit
        run: npm audit --omit=optional

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify generated rules data
        run: git diff --exit-code -- src/rules-data.js

      - name: Verify dist/worker.js exists
        run: test -f dist/worker.js && echo "build OK"
